<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP Sales v3.0 - SaaS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        cardbg: '#131c2e',
                        accentwb: '#7f56d9',
                        accentoz: '#005bff'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-100 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-cardbg border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-lg font-bold bg-gradient-to-r from-purple-400 to-blue-500 bg-clip-text text-transparent">MP Sales v3.0</h1>
        <div class="flex gap-2 text-xs">
            <span class="bg-purple-900/50 text-purple-300 px-2 py-1 rounded border border-purple-700/50">PRO SaaS</span>
        </div>
    </header>

    <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6 pb-20">
        <!-- Навигационные вкладки -->
        <div class="flex gap-2 overflow-x-auto pb-2 border-b border-gray-800">
            <button onclick="switchTab('seo')" id="tab-seo" class="px-4 py-2 rounded-lg bg-accentwb text-white text-sm font-medium transition">SEO & Контент</button>
            <button onclick="switchTab('unit')" id="tab-unit" class="px-4 py-2 rounded-lg bg-cardbg text-gray-400 hover:text-white text-sm font-medium transition">Юнит-Экономика</button>
            <button onclick="switchTab('visual')" id="tab-visual" class="px-4 py-2 rounded-lg bg-cardbg text-gray-400 hover:text-white text-sm font-medium transition">Визуал / Инфографика</button>
            <button onclick="switchTab('history')" id="tab-history" class="px-4 py-2 rounded-lg bg-cardbg text-gray-400 hover:text-white text-sm font-medium transition">Шаблоны & История</button>
        </div>

        <!-- SEO Вкладка -->
        <section id="content-seo" class="space-y-4">
            <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
                <h2 class="font-semibold text-sm text-gray-300">Расширенный SEO Генератор</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Площадка</label>
                        <select id="marketplace" class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                            <option value="wb">Wildberries</option>
                            <option value="ozon">Ozon</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Tone of Voice</label>
                        <select id="tone" class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                            <option value="sales">Продающий</option>
                            <option value="expert">Экспертный</option>
                            <option value="emotional">Эмоциональный</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Название товара / Артикул для анализа</label>
                    <input type="text" id="product-name" placeholder="Например: Рюкзак городской анатомический" class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                </div>
                <button onclick="generateSEO()" class="w-full bg-accentwb hover:bg-purple-600 transition text-white font-medium p-2 rounded-lg text-sm">Сгенерировать SEO-пакет с Гэп-анализом</button>
            </div>
        </section>

        <!-- Юнит-Экономика Вкладка -->
        <section id="content-unit" class="hidden space-y-4">
            <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
                <h2 class="font-semibold text-sm text-gray-300">Калькулятор Юнит-Экономики</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Цена продажи (₽)</label>
                        <input type="number" id="price" value="2000" class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Себестоимость (₽)</label>
                        <input type="number" id="cost" value="550" class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Комиссия Платформы (%)</label>
                        <input type="number" id="commission" value="15" class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Логистика (₽)</label>
                        <input type="number" id="logistics" value="90" class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                    </div>
                </div>
                <button onclick="calculateUnit()" class="w-full bg-accentoz hover:bg-blue-600 transition text-white font-medium p-2 rounded-lg text-sm">Рассчитать показатели</button>
                <div id="unit-result" class="p-3 bg-darkbg rounded-lg border border-gray-800 text-sm space-y-1">
                    <p class="text-gray-400">Чистая прибыль: <span class="text-green-400 font-bold" id="net-profit">0 ₽</span></p>
                    <p class="text-gray-400">ROI: <span class="text-blue-400 font-bold" id="roi">0%</span></p>
                </div>
            </div>
        </section>

        <!-- Визуал и Инфографика Вкладка -->
        <section id="content-visual" class="hidden space-y-4">
            <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
                <h2 class="font-semibold text-sm text-gray-300">Конструктор инфографики MP Sales</h2>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Стиль оформления</label>
                    <select class="w-full bg-darkbg border border-gray-700 rounded-lg p-2 text-sm text-white">
                        <option>Премиум / Лакшери</option>
                        <option>Технический / Инфографика</option>
                        <option>Эко / Натуральный</option>
                        <option>Яркий Promo / SALE</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Маркетинговые бейджи</label>
                    <div class="flex flex-wrap gap-2 text-xs">
                        <span class="bg-darkbg border border-gray-700 px-3 py-1.5 rounded-lg cursor-pointer hover:border-accentwb">🔥 Хит продаж</span>
                        <span class="bg-darkbg border border-gray-700 px-3 py-1.5 rounded-lg cursor-pointer hover:border-accentwb">🛡️ Гарантия 1 год</span>
                        <span class="bg-darkbg border border-gray-700 px-3 py-1.5 rounded-lg cursor-pointer hover:border-accentwb">🌿 Премиум материал</span>
                    </div>
                </div>
                <button onclick="alert('Генерация продающей обложки через API запущена')" class="w-full bg-purple-600 hover:bg-purple-700 transition text-white font-medium p-2 rounded-lg text-sm">Запустить генерацию визуала</button>
            </div>
        </section>

        <!-- История и Шаблоны Вкладка -->
        <section id="content-history" class="hidden space-y-4">
            <div class="bg-cardbg p-4 rounded-xl border border-gray-800 space-y-3">
                <h2 class="font-semibold text-sm text-gray-300">Облачные шаблоны и история</h2>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between items-center bg-darkbg p-3 rounded-lg border border-gray-800">
                        <span>Пресет: Одежда (УСН 6%)</span>
                        <button class="text-accentwb text-xs hover:underline">Загрузить</button>
                    </div>
                    <div class="flex justify-between items-center bg-darkbg p-3 rounded-lg border border-gray-800">
                        <span>Пресет: Дом и сад (Ozon)</span>
                        <button class="text-accentwb text-xs hover:underline">Загрузить</button>
                    </div>
                </div>
                <button onclick="exportData()" class="w-full bg-gray-800 hover:bg-gray-700 transition text-white font-medium p-2 rounded-lg text-sm">Экспортировать бэкап (JSON / XLSX)</button>
            </div>
        </section>
    </main>

    <script>
        function switchTab(tabId) {
            ['seo', 'unit', 'visual', 'history'].forEach(id => {
                document.getElementById(`content-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).classList.remove('bg-accentwb', 'text-white');
                document.getElementById(`tab-${id}`).classList.add('bg-cardbg', 'text-gray-400');
            });
            document.getElementById(`content-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('bg-cardbg', 'text-gray-400');
            document.getElementById(`tab-${tabId}`).classList.add('bg-accentwb', 'text-white');
        }

        function calculateUnit() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const cost = parseFloat(document.getElementById('cost').value) || 0;
            const commission = parseFloat(document.getElementById('commission').value) || 0;
            const logistics = parseFloat(document.getElementById('logistics').value) || 0;

            const commVal = price * (commission / 100);
            const profit = price - cost - commVal - logistics;
            const roi = cost > 0 ? (profit / cost) * 100 : 0;

            document.getElementById('net-profit').innerText = profit.toFixed(2) + ' ₽';
            document.getElementById('roi').innerText = roi.toFixed(1) + '%';
        }

        function generateSEO() {
            const name = document.getElementById('product-name').value;
            if(!name) {
                alert('Пожалуйста, введите название товара или артикул');
                return;
            }
            alert('SEO-пакет и гэп-анализ для "' + name + '" успешно сформированы!');
        }

        function exportData() {
            alert('Все шаблоны и расчеты успешно выгружены.');
        }

        calculateUnit();
    </script>
</body>
</html>
